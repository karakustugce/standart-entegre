    desc: "Cardboard reels with a paper tube barrel for light cable, wire, hose and strip. A light, economical alternative to wooden cable reels."
    h1: "Cardboard reels"
    lead: "Reels with a cardboard barrel for winding light cable, wire, hose and strip. Lighter than a wooden reel and economical for one-way shipments."
    image_alt: "Two cardboard reels with paper tube barrels and pressed board flanges"
    card_alt: "Cardboard reel"
    facts:
      - ["Light", "Low packaging weight"]
      - ["Economical", "For one-way shipments"]
      - ["Made to size", "Barrel and flange set by the product"]
    spec:
