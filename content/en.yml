      - ["Use", "Light cable, wire, hose, strip and similar products"]
      - ["Sizing inputs", "Diameter, length and weight of the wound product"]
      - ["Production", "Gebze plant"]
    sections:
      - id: kullanim
        h: "Where are cardboard reels used?"
        p: "For light, long products: thin cable, wire, hose and strip. Heavy power cable ships on wooden cable reels."
      - id: ahsap-karsilastirma
        h: "Cardboard or wooden reel?"
        p: "Cardboard reels are light and economical; wooden reels are for heavy loads, large diameters and reuse. We help you choose the right one for your product."
