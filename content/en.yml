about:
  h1: "From log to shipment, under one roof."
  lead: "Standart Entegre is an integrated wooden packaging manufacturer making cable reels, cardboard reels, pallets, crates and marble crates."
  story_eyebrow: "Our story"
  story:
    - "“Entegre” in our name means integrated, and it describes how we work. Log cutting, timber preparation, reel and crate making and shipping all happen within one operation. We prepare our raw material by cutting logs ourselves, and we also import boards and compressed blocks."
    - "At our Gebze plant we make wooden cable reels, cardboard reels, wooden pallets, transport and export crates and marble crates. Our customers are power and telecom cable makers, steel rope and wire producers, marble and natural stone companies and exporting manufacturers."
    - "Every order starts from the load: the cable’s cross-section and length, the slab size, the machine’s weight. We build wooden reels with flange diameters from 55 cm to 3.20 m, in standard reel sizes and in custom sizes for each project."
  facility_eyebrow: "Plant and capacity"
