products:
  makara:
    slug: wooden-cable-reels
    name: "Wooden Cable Reels"
    card: "Cable shipping reels. Ø 55 cm – 3.20 m. For power, telecom, fibre optic cable and steel rope."
    tag: "Main product line · Ø 55 cm – 3.20 m"
    title: "Wooden Cable Reels · Cable Drums 55 cm – 3.20 m | Standart Entegre"
    desc: "Wooden cable reels with flange diameters from 55 cm to 3.20 m. Standard and custom wooden cable drums for power, telecom, fibre optic cable and steel wire rope."
    h1: "Wooden cable reels"
    lead: "Wooden reels with flange diameters from 55 cm up to 3.20 m, for winding, storing and shipping power, telecom and fibre optic cables and steel rope."
    image_alt: "Parts of a wooden cable reel: two flanges, the drum and tie rods"
    card_alt: "Wooden cable reel"
    facts:
      - ["Ø 55 cm – 3.20 m", "Flange diameter range"]
      - ["4", "Cable types: power, telecom, fibre optic, steel rope"]
      - ["Standard and custom", "Series sizes and project-specific builds"]
    spec:
      - ["Flange diameter", "55 cm – 3.20 m (550 – 3200 mm)"]
      - ["Use", "Power, telecom and fibre optic cables; steel rope and wire"]
      - ["Sizes", "Standard reel sizes or custom-sized to the cable"]
      - ["Sizing inputs", "Cable cross-section, total length, bending radius and shipping method"]
      - ["Production", "Gebze plant"]
    sections:
      - id: enerji
        h: "Reels for power cable"
        p: "Medium and high voltage power cables are heavy and thick. For these we build high-capacity wooden reels with flange diameters up to 3.20 m."
      - id: telekom
        h: "Reels for telecom cable"
        p: "Mid-size wooden reels for communication and data cable. Options start at 55 cm flange diameter and are sized to the cable length."
      - id: fiber
        h: "Reels for fibre optic cable"
        p: "Fibre optic cable is sensitive to bending. The drum diameter is set by the cable’s minimum bending radius, with an even winding surface."
      - id: celik-halat
        h: "Reels for steel rope and wire"
        p: "Wooden reels with reinforced flanges and drum for dense, heavy windings."
      - id: standart-makara
        h: "Standard reels and custom sizes"
        p: "Standard reel series in common sizes keep lead times short on repeat orders. When your cable does not fit a standard size, flange, drum and traverse are set for the project."
      - id: agac-makara
        h: "Wooden reel, cable drum, cable spool"
        p: "The industry uses several names for the same product: a wooden reel, cable drum or cable spool, made of timber flanges and a drum joined by tie rods."
    faq:
      - ["What reel sizes do you produce?", "We produce wooden cable reels with flange diameters from 55 cm up to 3.20 m."]
      - ["What do you need for a quote?", "Cable type, cable outer diameter, total length, the flange diameter if known, and quantity. Attach a technical drawing if you have one."]
      - ["Do large reels fit in a container?", "A standard container door is about 2.28 m high, a high-cube door about 2.58 m. Larger reels may need open-top or flat-rack shipping."]
    tool_link: "Open the reel size tool"

