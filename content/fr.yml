    card_alt: "Touret de câble en bois"
    facts:
      - ["Ø 55 cm – 3,20 m", "Diamètre des joues"]
      - ["4", "Types de câble : énergie, télécoms, fibre optique, acier"]
      - ["Standard et sur mesure", "Séries et fabrication par projet"]
    spec:
      - ["Diamètre des joues", "55 cm – 3,20 m (550 – 3200 mm)"]
      - ["Usage", "Câbles d’énergie, télécoms et fibre optique ; câbles et fils d’acier"]
      - ["Dimensions", "Tailles standard ou sur mesure selon le câble"]
      - ["Dimensionnement", "Section du câble, longueur totale, rayon de courbure et mode d’expédition"]
      - ["Production", "Usine de Gebze"]
    sections:
      - id: enerji
        h: "Tourets pour câbles d’énergie"
        p: "Les câbles moyenne et haute tension sont lourds et de forte section. Nous fabriquons pour eux des tourets en bois à haute capacité, jusqu’à 3,20 m de diamètre de joue."
      - id: telekom
        h: "Tourets pour câbles télécoms"
        p: "Tourets en bois de taille moyenne pour câbles de communication et de données. À partir de 55 cm de diamètre de joue, dimensionnés selon la longueur du câble."
      - id: fiber
        h: "Tourets pour câbles à fibre optique"
        p: "La fibre optique est sensible à la courbure. Le diamètre du fût est défini selon le rayon de courbure minimal, avec une surface d’enroulement régulière."
      - id: celik-halat
        h: "Tourets pour câbles et fils d’acier"
        p: "Tourets en bois à joues et fût renforcés pour les enroulements denses et lourds."
      - id: standart-makara
        h: "Tourets standard et dimensions sur mesure"
        p: "Les séries de tourets standard dans les tailles courantes réduisent les délais pour les commandes répétées. Si votre câble sort des tailles standard, joues, fût et largeur sont définis pour le projet."
      - id: agac-makara
        h: "Touret, bobine, tambour de câble"
        p: "Le secteur emploie plusieurs noms pour le même produit : touret, bobine ou tambour de câble, composé de joues et d’un fût en bois assemblés par des tiges."
    faq:
      - ["Quelles tailles de tourets fabriquez-vous ?", "Nous fabriquons des tourets de câble en bois avec des joues de 55 cm jusqu’à 3,20 m de diamètre."]
      - ["De quelles informations avez-vous besoin pour un devis ?", "Type de câble, diamètre extérieur, longueur totale, diamètre de joue souhaité s’il est connu, et quantité. Joignez un plan si vous en avez un."]
      - ["Les grands tourets entrent-ils dans un conteneur ?", "La porte d’un conteneur standard mesure environ 2,28 m de haut, celle d’un high-cube environ 2,58 m. Au-delà, un transport open-top ou flat-rack peut être nécessaire."]
