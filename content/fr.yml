about:
  h1: "De la grume à l’expédition, sous un même toit."
  lead: "Standart Entegre est un fabricant intégré d’emballages en bois : tourets de câble, bobines en carton, palettes, caisses et caisses à marbre."
  story_eyebrow: "Notre histoire"
  story:
    - "« Entegre » signifie intégré, et décrit notre façon de travailler. Le sciage des grumes, la préparation du bois, la fabrication des tourets et des caisses et l’expédition se font au sein d’une même structure. Nous préparons notre matière première en sciant nous-mêmes les grumes, et importons aussi des planches et des blocs compressés."
    - "Dans notre usine de Gebze, nous fabriquons des tourets de câble en bois, des bobines en carton, des palettes, des caisses de transport et d’exportation et des caisses à marbre. Nos clients sont des câbliers énergie et télécoms, des fabricants de câbles et fils d’acier, des entreprises du marbre et de la pierre naturelle et des industriels exportateurs."
    - "Chaque commande part de la charge : la section et la longueur du câble, la taille des tranches, le poids de la machine. Nous fabriquons des tourets en bois de 55 cm à 3,20 m de diamètre de joue, en tailles standard comme sur mesure."
  facility_eyebrow: "Usine et capacité"
  facts_fixed:
    - ["Ø 55 cm – 3,20 m", "Diamètre des joues"]
    - ["5", "Familles de produits"]
    - ["Gebze", "Site de production"]
  facts_labels:
    founded: "Création"
    facility_area_m2: "Surface (m²)"
    lumber_m3_year: "Bois par an (m³)"
    reels_year: "Tourets par an"
    employees: "Salariés"
  process_eyebrow: "Processus de production"
  process:
    - ["Grumes et matière première", "Réception et tri des grumes ; planches et blocs compressés importés."]
    - ["Sciage", "Grumes débitées à dimension ; préparation du bois."]
    - ["Fabrication", "Joues, fûts, palettes, caisses et caisses à marbre ; assemblage."]
    - ["Contrôle", "Contrôle des dimensions, des assemblages et du montage."]
    - ["Expédition", "Livraison prête au chargement, en national et à l’export."]
