about:
  h1: "Tomruktan sevkiyata, tek yapı içinde."
  lead: "Standart Entegre; kablo sevk makarası, karton makara, palet, sandık ve mermer kasası üreten entegre bir ahşap ambalaj üreticisidir."
  story_eyebrow: "Hikâyemiz"
  story:
    - "Adımızdaki “entegre” bir üretim biçimini anlatır. Tomruk kesiminden kereste hazırlığına, makara ve sandık imalatından sevkiyata kadar işin tamamını aynı yapı içinde yürütürüz. Hammaddeyi tomruk kesimiyle kendimiz hazırlar, tahta ve sıkıştırılmış takozu ithalat yoluyla da tedarik ederiz."
    - "Gebze tesisimizde kablo sevk makaraları, karton makaralar, ahşap paletler, taşıma ve ihracat sandıkları ile mermer kasaları üretiyoruz. Müşterilerimiz enerji ve telekomünikasyon kablosu üreticileri, çelik halat ve tel üreticileri, mermer ve doğal taş firmaları ve ihracat yapan sanayi kuruluşlarıdır."
    - "Her siparişe yükten başlarız: kablonun kesiti ve boyu, plakanın ölçüsü, makinenin ağırlığı. Ahşap makaralarda 55 cm’den 3,20 m’ye kadar yanak çapında üretim yapıyor, standart makara ölçülerinin yanında projeye özel ölçüler de hazırlıyoruz."
  facility_eyebrow: "Tesis ve kapasite"
  facts_fixed:
    - ["Ø 55 cm – 3,20 m", "Makara yanak çapı"]
    - ["5", "Ürün ailesi"]
    - ["Gebze", "Üretim tesisi"]
