products:
  makara:
    slug: ahsap-kablo-makaralari
    name: "Ahşap Kablo Makaraları"
    card: "Kablo sevk makaraları. Ø 55 cm – 3,20 m. Enerji, telekom, fiber optik ve çelik halat için."
    tag: "Ana ürün grubu · Ø 55 cm – 3,20 m"
    title: "Kablo Sevk Makaraları · Ahşap Makara 55 cm – 3,20 m | Standart Entegre"
    desc: "Ahşap kablo sevk makaraları: 55 cm’den 3,20 m’ye yanak çapı. Enerji, telekom, fiber optik ve çelik halat için ahşap makara, ağaç makara ve standart makara üretimi."
    h1: "Ahşap kablo sevk makaraları"
    lead: "Yanak çapı 55 cm’den 3,20 m’ye kadar ahşap makaralar. Enerji, telekomünikasyon ve fiber optik kablolar ile çelik halatların sarımı, depolanması ve taşınması için."
    image_alt: "Ahşap kablo sevk makarasının parçaları: iki yanak, tambur ve bağlantı milleri"
    card_alt: "Ahşap kablo sevk makarası"
    facts:
      - ["Ø 55 cm – 3,20 m", "Yanak çapı aralığı"]
      - ["4", "Kablo tipi: enerji, telekom, fiber optik, çelik halat"]
      - ["Standart ve özel ölçü", "Seri ölçüler ve projeye özel üretim"]
    spec:
      - ["Yanak çapı", "55 cm – 3,20 m (550 – 3200 mm)"]
      - ["Kullanım", "Enerji, telekomünikasyon ve fiber optik kablolar; çelik halat ve tel"]
      - ["Ölçü seçeneği", "Standart makara ölçüleri veya kabloya göre özel ölçü"]
      - ["Ölçülendirme", "Kablo kesiti, toplam uzunluk, bükülme yarıçapı ve taşıma yöntemi"]
      - ["Üretim", "Gebze tesisi"]
    sections:
      - id: enerji
        h: "Enerji kablosu makaraları"
        p: "Orta ve yüksek gerilim enerji kabloları ağır ve kalın kesitlidir. Bu kablolar için yanak çapı 3,20 m’ye kadar çıkan, yüksek taşıma kapasiteli ahşap makaralar üretilir."
      - id: telekom
        h: "Telekomünikasyon kablosu makaraları"
        p: "Haberleşme ve data kabloları için orta çaplı ahşap makaralar. Yanak çapı 55 cm’den başlayan seçenekler, kablonun boyuna göre ölçülendirilir."
      - id: fiber
        h: "Fiber optik kablo makaraları"
        p: "Fiber optik kablolar bükülmeye hassastır. Tambur çapı, kablonun minimum bükülme yarıçapına göre belirlenir; düzgün sarım yüzeyi sağlanır."
      - id: celik-halat
        h: "Çelik halat ve tel makaraları"
        p: "Yoğun ve ağır sarımlar için güçlendirilmiş yanak ve tambur yapısına sahip ahşap makaralar."
      - id: standart-makara
        h: "Standart makara ve özel ölçü"
        p: "Sık kullanılan ölçülerde standart makara serileri, tekrarlayan siparişlerde hızlı termin sağlar. Kablonuz standart ölçülere uymadığında yanak, tambur ve iç genişlik projeye göre özel olarak belirlenir."
      - id: agac-makara
        h: "Ahşap makara mı, ağaç makara mı?"
        p: "Sektörde ahşap makara, ağaç makara ve tahta makara aynı ürün için kullanılır: kerestenin yanak ve tambur olarak işlenip bağlantı milleriyle birleştirildiği kablo sevk makarası."
    faq:
      - ["Makara üretim ölçünüz nedir?", "Ahşap kablo sevk makaralarında yanak çapı 55 cm’den 3,20 m’ye kadar üretim yapıyoruz."]
      - ["Teklif için hangi bilgiler gerekir?", "Kablo tipi, kablo dış çapı, toplam uzunluk, istenen yanak çapı (biliniyorsa) ve adet. Teknik çiziminiz varsa ekleyin."]
      - ["Büyük çaplı makaralar konteynere sığar mı?", "Standart konteyner kapısı yaklaşık 2,28 m, high-cube kapısı yaklaşık 2,58 m yüksekliktedir. Daha büyük çaplar açık üst veya flat-rack sevkiyat gerektirebilir."]
    tool_link: "Ölçü aracını açın"

