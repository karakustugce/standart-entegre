about:
  h1: "من جذع الشجرة حتى الشحن، تحت سقف واحد."
  lead: "Standart Entegre شركة متكاملة لتصنيع التغليف الخشبي: بكرات الكابلات والبكرات الكرتونية والمنصات والصناديق وصناديق الرخام."
  story_eyebrow: "قصتنا"
  story:
    - "كلمة «Entegre» في اسمنا تعني «متكامل»، وهي تصف طريقة عملنا. قطع الجذوع وتجهيز الأخشاب وتصنيع البكرات والصناديق والشحن تتم جميعها ضمن منظومة واحدة. نجهّز المادة الخام بقطع الجذوع بأنفسنا، ونستورد أيضاً الألواح والقطع المضغوطة."
    - "في مصنعنا في جبزة نصنع بكرات الكابلات الخشبية والبكرات الكرتونية والمنصات الخشبية وصناديق النقل والتصدير وصناديق الرخام. عملاؤنا هم مصنّعو كابلات الطاقة والاتصالات، ومنتجو الحبال والأسلاك الفولاذية، وشركات الرخام والحجر الطبيعي، والمصانع المصدّرة."
    - "يبدأ كل طلب من الحمولة: مقطع الكابل وطوله، مقاس اللوح، وزن الآلة. نصنع بكرات خشبية بقطر جوانب من 55 سم إلى 3.20 م، بمقاسات قياسية ومخصصة لكل مشروع."
  facility_eyebrow: "المصنع والطاقة الإنتاجية"
  facts_fixed:
    - ["55 سم – 3.20 م", "قطر جانب البكرة"]
    - ["5", "عائلات منتجات"]
    - ["جبزة", "موقع الإنتاج"]
  facts_labels:
    founded: "سنة التأسيس"
    facility_area_m2: "مساحة المصنع (م²)"
    lumber_m3_year: "الخشب سنوياً (م³)"
    reels_year: "البكرات سنوياً"
    employees: "عدد الموظفين"
  process_eyebrow: "مراحل الإنتاج"
  process:
    - ["الجذوع والمواد الخام", "استلام الجذوع وفرزها؛ ألواح وقطع مضغوطة مستوردة."]
    - ["القطع", "نشر الجذوع حسب المقاس وتجهيز الخشب."]
    - ["التصنيع", "تصنيع الجوانب والأسطوانات والمنصات والصناديق وصناديق الرخام وتجميعها."]
    - ["الفحص", "فحص المقاسات والوصلات والتجميع."]
