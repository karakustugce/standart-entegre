        h: "بكرات كابلات الاتصالات"
        p: "بكرات خشبية متوسطة الحجم لكابلات الاتصال والبيانات، تبدأ من قطر جانب 55 سم وتُصمَّم حسب طول الكابل."
      - id: fiber
        h: "بكرات كابلات الألياف الضوئية"
        p: "الألياف الضوئية حساسة للانحناء. يُحدَّد قطر الأسطوانة وفق أدنى نصف قطر انحناء للكابل مع سطح لف منتظم."
      - id: celik-halat
        h: "بكرات الحبال والأسلاك الفولاذية"
        p: "بكرات خشبية بجوانب وأسطوانة مدعّمة للّفات الكثيفة والثقيلة."
      - id: standart-makara
        h: "البكرات القياسية والمقاسات المخصصة"
        p: "سلاسل البكرات القياسية بالمقاسات الشائعة تختصر مدة التسليم في الطلبات المتكررة. وإذا لم يناسب كابلك مقاساً قياسياً، تُحدَّد الجوانب والأسطوانة والعرض حسب المشروع."
      - id: agac-makara
        h: "بكرة خشبية، طبلة كابل"
        p: "يستخدم القطاع عدة أسماء للمنتج نفسه: بكرة خشبية أو طبلة كابل، تتكوّن من جانبين وأسطوانة من الخشب تربطها قضبان."
    faq:
      - ["ما مقاسات البكرات التي تصنعونها؟", "نصنع بكرات كابلات خشبية بقطر جوانب من 55 سم حتى 3.20 م."]
