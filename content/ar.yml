      - ["هل تدخل البكرات الكبيرة في الحاوية؟", "يبلغ ارتفاع باب الحاوية القياسية نحو 2.28 م، وباب حاوية high-cube نحو 2.58 م. قد تحتاج الأقطار الأكبر إلى شحن بحاوية مفتوحة السقف أو flat-rack."]
