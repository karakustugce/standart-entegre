{% extends "base.html" %}
{% from "_macros.html" import refs_block with context %}
{% block main %}
<section class="pp-hero px">
  <nav class="crumb" aria-label="breadcrumb"><a href="{{ link(home_path) }}">{{ L.nav.home }}</a><span>/</span><span>{{ L.refs.page_h }}</span></nav>
  <div class="pp-top">
    <h1>{{ L.refs.page_h }}</h1>
    <div class="pp-side"><p>{{ L.refs.lead }}</p></div>
  </div>
</section>
<section class="sec px refs" style="padding-top:clamp(40px,5vw,72px)">
  {{ refs_block() }}
</section>
<section class="sec px rfq" style="padding-block:clamp(72px,9vw,140px)">
  <div class="rfq-grid">
    <div class="rfq-intro"><h2>{{ L.refs.cta_h }}</h2></div>
    <div class="rfq-intro" style="align-content:end">
      <p>{{ L.rfq.short_p }}</p>
      <div><a class="btn btn-solid" href="{{ link(home_path) }}#teklif"><span>{{ L.rfq.short_cta }}</span> <i>{{ L.arrow }}</i></a></div>
    </div>
  </div>
</section>
{% endblock %}
